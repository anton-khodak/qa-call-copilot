# Prices in USD per 1M tokens; timeouts in seconds; max_attempts includes the first try.
models:
  gpt4o_mini:
    provider: openrouter
    model_id: openai/gpt-4o-mini
    base_url: https://openrouter.ai/api/v1
    price_input_per_1m: 0.15
    price_output_per_1m: 0.60
    timeout_s: 60
    max_attempts: 3
  qwen3_8b:
    provider: ollama
    model_id: qwen3:8b
    base_url: http://localhost:11434  # overridden by OLLAMA_HOST
    price_input_per_1m: 0
    price_output_per_1m: 0
    timeout_s: 300
    max_attempts: 3
    context_tokens: 16384  # longest selected call is ~10k tokens; Ollama's default 4096 would truncate
    max_output_tokens: 1024  # a valid record is ~300 tokens; qwen3 can loop in the objections list
  qwen3_14b:  # same family as qwen3_8b: isolates the effect of model size
    provider: ollama
    model_id: qwen3:14b
    base_url: http://localhost:11434  # overridden by OLLAMA_HOST
    price_input_per_1m: 0
    price_output_per_1m: 0
    timeout_s: 300
    max_attempts: 3
    context_tokens: 16384
    max_output_tokens: 1024
  opus_5_5:  # frontier reference, run through the local Claude Code CLI (`claude -p`); sampling: cli_default only
    provider: claude_code
    model_id: claude-opus-5-5
    base_url: ""  # not used: the CLI uses its own login
    price_input_per_1m: 4.00  # derived from the CLI-reported cost; estimates only, records use that reported cost
    price_output_per_1m: 20.00
    timeout_s: 300
    max_attempts: 3
